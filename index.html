<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doçuras da Ana</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Roboto',sans-serif;background:#fffaf5;color:#333;line-height:1.6;}

/* Navbar */
.navbar{position:fixed;top:0;left:0;width:100%;background:#6b3e26;color:white;
display:flex;justify-content:space-between;align-items:center;padding:15px 10%;
box-shadow:0 2px 10px rgba(0,0,0,.2);z-index:1000;}
.navbar h2{font-family:'Pacifico',cursive;}
.navbar a{color:white;text-decoration:none;margin:0 15px;transition:.3s;}
.navbar a:hover{color:#f7e8d8;}

/* Hero */
.hero{background:linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.45)),
url('https://images.unsplash.com/photo-1551024601-bec78aea704b');
background-size:cover;background-position:center;height:100vh;
display:flex;align-items:center;justify-content:center;text-align:center;color:white;}
.hero h1{font-family:'Pacifico',cursive;font-size:4rem;margin-bottom:20px;animation:fadeIn 2s;}
.hero p{font-size:1.3rem;margin-bottom:30px;animation:fadeIn 3s;}
.btn{background:#25D366;color:white;padding:15px 30px;border-radius:50px;text-decoration:none;font-weight:bold;transition:.3s;animation:fadeIn 4s;}
.btn:hover{background:#128C7E;}
@keyframes fadeIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}

/* Seções */
.section{padding:80px 10%;}
.section-title{text-align:center;font-size:2.5rem;margin-bottom:50px;color:#6b3e26;font-family:'Pacifico',cursive;}

/* Sobre */
.sobre{display:flex;flex-wrap:wrap;align-items:center;gap:40px;}
.sobre img{width:300px;border-radius:20px;box-shadow:0 5px 15px rgba(0,0,0,.2);}
.sobre div{flex:1;}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:30px;}
.card{background:white;border-radius:20px;overflow:hidden;box-shadow:0 5px 15px rgba(0,0,0,.1);transition:.3s;}
.card:hover{transform:scale(1.05);}
.card img{width:100%;height:250px;object-fit:cover;}
.card-content{padding:20px;}
.card-content h3{color:#6b3e26;margin-bottom:10px;}

/* Footer */
.footer{background:#6b3e26;color:white;text-align:center;padding:50px 20px;}
.footer a{color:white;margin:0 10px;text-decoration:none;}
.footer a:hover{color:#f7e8d8;}
</style>
</head>
<body>

<header class="navbar">
  <h2>🍮 Doçuras da Ana</h2>
  <nav>
    <a href="#sobre">
